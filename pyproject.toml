[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "lakehouse-doctor"
version = "0.1.0"
description = "Health checks and fixes for Delta Lake and Apache Iceberg tables: small files, skew, data skipping, snapshots, vacuum."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Amritansh Agrawal" }]
requires-python = ">=3.10"
dependencies = ["deltalake>=1.0,<2", "pyarrow>=14", "sqlglot>=30,<31"]
keywords = ["delta-lake", "lakehouse", "databricks", "optimize", "z-order", "data-engineering"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Topic :: Database"]

[project.optional-dependencies]
iceberg = ["pyiceberg[pyarrow]>=0.10"]
dev = ["pytest>=8", "ruff>=0.5", "pyiceberg[pyarrow,sql-sqlite]>=0.10"]

[project.scripts]
lakehouse-doctor = "lakehouse_doctor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lakehouse_doctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
